<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>SV BARBERIA · Admin</title>
<style>
:root{
  --bg:#f4f4f2;--card:#fff;--ink:#0a0a0a;--muted:#7a7a76;--line:#e7e7e2;--soft:#f1f1ee;--r:14px;
  --green:#16844b;--green-bg:#eef8f2;--red:#d83a3a;--red-bg:#fff1f1;--blue:#2867d8;--blue-bg:#eef4ff;
  --orange:#d96d15;--orange-bg:#fff3e8;--purple:#7054d8;--purple-bg:#f2efff;--black:#090909;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}.hidden{display:none!important}button{touch-action:manipulation}
body{padding-bottom:env(safe-area-inset-bottom)}
.logo{display:block;width:138px;height:auto}.logo text{font-family:Arial Black,Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:2.5px}
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;padding:26px 20px}.login-card{width:100%;max-width:390px}.login-logo{margin-bottom:34px}.overline{font-size:8px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:-.05em;margin-top:7px}.login-sub{margin-top:5px;color:var(--muted);font-size:10px}
.field{margin-top:14px}.field label{display:block;font-size:8px;font-weight:800;letter-spacing:.10em;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;outline:none;min-height:42px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#111;box-shadow:0 0 0 2px rgba(0,0,0,.04)}
.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:800;font-size:9px;letter-spacing:.05em;cursor:pointer;min-height:40px}.btn.black{background:#050505;color:#fff}.btn.white{background:#fff;border:1px solid var(--line)}.btn.full{width:100%;margin-top:18px}.error{margin-top:10px;padding:10px 11px;border:1px solid #111;border-radius:9px;font-size:9px;font-weight:700}.login-foot{display:none}
.app{min-height:100vh}.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 12px}.appbar-in{width:100%;max-width:430px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.app-logo{width:105px}.appbar-actions{display:flex;align-items:center;gap:8px}.branch{font-size:7px;color:var(--muted);text-align:right;line-height:1.35}.branch b{font-size:7px;color:#222}.logout{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:7px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.main{width:100%;max-width:430px;margin:auto;padding:14px 12px 96px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}.title{font-size:20px;font-weight:800;letter-spacing:-.05em}.date{font-size:8px;color:var(--muted);margin-top:3px}.grid{display:grid;gap:8px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}.klabel{font-size:7px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.kvalue{font-size:18px;font-weight:800;letter-spacing:-.05em;margin-top:6px;line-height:1.08}.ksub{font-size:8px;color:var(--muted);margin-top:4px}.section{margin-top:9px}.section-title{font-size:10px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em}.list{display:grid;gap:6px}.row{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:9px;cursor:pointer}.row:active{transform:scale(.995);background:#fafafa}.row-main{min-width:0}.row-title{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:8px;color:var(--muted);margin-top:3px;line-height:1.3}.row-right{text-align:right;flex:none}.amt{font-size:10px;font-weight:800}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:7px;font-weight:800}.pill.black{background:#050505;color:#fff;border-color:#050505}.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:9px}.search{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px;font-size:9px;margin-bottom:8px;outline:none}.balance{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.balance:last-child{border-bottom:0}.balance strong{font-size:16px;letter-spacing:-.04em}.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:var(--blue)}.bar-meta{display:flex;justify-content:space-between;font-size:8px;font-weight:700;margin-top:9px}
.bottomnav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:100%;max-width:430px;background:rgba(255,255,255,.98);backdrop-filter:blur(14px);border:1px solid var(--line);border-bottom:0;padding:5px 5px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:2px;border-radius:14px 14px 0 0;box-shadow:0 -5px 20px rgba(0,0,0,.04)}
.navbtn{border:0;background:transparent;padding:7px 1px 6px;border-radius:9px;font-size:6.5px;font-weight:800;color:#8a8a86;cursor:pointer;min-width:0;letter-spacing:.01em}.navbtn::before{content:'';display:block;width:5px;height:5px;border-radius:50%;background:#bdbdb8;margin:0 auto 4px}.navbtn[data-go="clientes"]::before{background:var(--orange)}.navbtn[data-go="ingresos"]::before{background:var(--green)}.navbtn[data-go="egresos"]::before{background:var(--red)}.navbtn[data-go="caja"]::before{background:var(--purple)}.navbtn[data-go="reportes"]::before{background:var(--blue)}
.navbtn.active{background:#0a0a0a;color:#fff}.navbtn.active[data-go="clientes"]{background:var(--orange)}.navbtn.active[data-go="ingresos"]{background:var(--green)}.navbtn.active[data-go="egresos"]{background:var(--red)}.navbtn.active[data-go="caja"]{background:var(--purple)}.navbtn.active[data-go="reportes"]{background:var(--blue)}.navbtn.active::before{background:#fff}
.fab{position:fixed;left:50%;bottom:73px;transform:translateX(151px);z-index:25;width:44px;height:44px;border-radius:50%;border:0;background:#050505;color:#fff;font-size:22px;line-height:1;box-shadow:0 9px 24px rgba(0,0,0,.18);cursor:pointer}.fab:active{transform:translateX(151px) scale(.96)}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.56);display:flex;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:430px;background:#fff;border-radius:20px 20px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 -20px 50px rgba(0,0,0,.18)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}.modal-title{font-size:15px;font-weight:800;letter-spacing:-.03em}.x{border:0;background:var(--soft);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer}.form2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:#050505;color:#fff;border-radius:999px;padding:9px 13px;font-size:8px;font-weight:800;white-space:nowrap}.client-hero{padding:8px 0 2px}.client-name{font-size:18px;font-weight:800;letter-spacing:-.04em}.client-meta{font-size:8px;color:var(--muted);margin-top:4px}.mini-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
/* Colores funcionales por módulo */
body[data-section="clientes"] .title,body[data-section="clientes"] .amt{color:var(--orange)}
body[data-section="clientes"] .kvalue{color:var(--orange)}
body[data-section="ingresos"] .title,body[data-section="ingresos"] .amt,body[data-section="ingresos"] .kvalue{color:var(--green)}
body[data-section="egresos"] .title,body[data-section="egresos"] .amt,body[data-section="egresos"] .kvalue{color:var(--red)}
body[data-section="caja"] .title,body[data-section="caja"] .kvalue{color:var(--purple)}
body[data-section="reportes"] .title,body[data-section="reportes"] .kvalue{color:var(--blue)}
body[data-section="ingresos"] .fab{background:var(--green)}body[data-section="egresos"] .fab{background:var(--red)}body[data-section="clientes"] .fab{background:var(--orange)}body[data-section="caja"] .fab{background:var(--purple)}body[data-section="reportes"] .fab{background:var(--blue)}
body[data-section="ingresos"] .card:first-child{border-color:#d9efe2}body[data-section="egresos"] .card:first-child{border-color:#f1d7d7}body[data-section="clientes"] .card:first-child{border-color:#f5dfcb}body[data-section="reportes"] .card:first-child{border-color:#d9e5fb}
@media(min-width:431px){body{background:#e9e9e6}.app{max-width:430px;margin:0 auto;background:var(--bg);box-shadow:0 0 50px rgba(0,0,0,.08);min-height:100vh}#loginView{max-width:430px;margin:0 auto}.appbar{max-width:430px;margin:0 auto}.fab{transform:translateX(151px)}.fab:active{transform:translateX(151px) scale(.96)}}
</style>
</head>
<body>
<section id="loginView">
  <form id="loginForm" class="login-card" autocomplete="off">
    <svg class="logo login-logo" viewBox="0 0 360 58" role="img" aria-label="SV BARBERIA"><text x="0" y="43" font-size="38">SV BARBERIA</text></svg>
    <div class="overline">Acceso privado</div>
    <h1>Ingresar</h1>
    <div class="login-sub">Av. San Martín 2060</div>
    <div class="field"><label>SUCURSAL</label><input value="Av. San Martín 2060" readonly></div>
    <div class="field"><label>CONTRASEÑA</label><input id="password" type="password" inputmode="text" autocapitalize="characters" placeholder="Contraseña" required></div>
    <button class="btn black full" type="submit">INGRESAR</button>
    <div id="loginError" class="error hidden">Contraseña incorrecta. Usá MATI123.</div>
    <div class="login-foot">Prueba funcional · datos guardados en este dispositivo.</div>
  </form>
</section>

<div id="appView" class="app hidden">
  <header class="appbar"><div class="appbar-in">
    <svg class="logo app-logo" viewBox="0 0 360 58" aria-label="SV BARBERIA"><text x="0" y="43" font-size="38">SV BARBERIA</text></svg>
    <div class="appbar-actions"><div class="branch">SUCURSAL<br><b>AV. SAN MARTÍN 2060</b></div><button id="logoutBtn" class="logout" type="button">SALIR</button></div>
  </div></header>
  <main id="page" class="main"></main>
  <button id="fab" class="fab" type="button">+</button>
  <nav id="nav" class="bottomnav"></nav>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>

<script>
(function(){
'use strict';
var PASSWORD='MATI123', KEY='svbarberia_mobile_v3';
function nowISO(){var d=new Date(),z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,10)}
function clone(x){return JSON.parse(JSON.stringify(x))}
var today=nowISO();
var SEED={bank:428000,cash:196500,clients:[
{id:1,name:'Nicolás Ferreyra',phone:'341 555-1840',email:'nico.ferreyra@email.com',notes:'Degradé bajo. Prefiere turno tarde.'},
{id:2,name:'Tomás Ruiz',phone:'341 555-2399',email:'tomasr@email.com',notes:'Corte clásico + barba.'},
{id:3,name:'Franco Martínez',phone:'341 555-8821',email:'franco.m@email.com',notes:'Fade medio.'},
{id:4,name:'Lucas Gómez',phone:'341 555-4192',email:'lucasg@email.com',notes:'Máquina 2 y perfilado.'},
{id:5,name:'Matías Pereyra',phone:'341 555-9340',email:'mati.p@email.com',notes:'Corte mensual.'}],
appointments:[
{id:1,date:today,time:'10:00',clientId:1,service:'Corte',barber:'SV',status:'Confirmado'},
{id:2,date:today,time:'11:30',clientId:2,service:'Corte + barba',barber:'SV',status:'Confirmado'},
{id:3,date:today,time:'15:00',clientId:3,service:'Corte',barber:'SV',status:'Pendiente'},
{id:4,date:today,time:'17:30',clientId:4,service:'Barba',barber:'SV',status:'Confirmado'}],
incomes:[
{id:1,date:today,clientId:1,service:'Corte',amount:15000,payment:'Transferencia',drink:'Agua',drinkAmount:0},
{id:2,date:today,clientId:2,service:'Corte + barba',amount:22000,payment:'Efectivo',drink:'Cerveza',drinkAmount:3500}],
expenses:[{id:1,date:today,category:'Insumos',detail:'Navajas + cuello descartable',amount:34000,payment:'Banco'}]};
function load(){try{var raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw)}catch(e){}return clone(SEED)}
var db=load(), current='turnos';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function fmt(n){try{return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0))}catch(e){return '$ '+Number(n||0).toFixed(0)}}
function dmy(s){if(!s)return'-';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function esc(s){return String(s==null?'':s).replace(/[&<>'"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function cid(id){for(var i=0;i<db.clients.length;i++)if(String(db.clients[i].id)===String(id))return db.clients[i];return null}
function cname(id){var c=cid(id);return c?c.name:'Cliente'}
function monthRows(a){var m=today.slice(0,7);return a.filter(function(x){return (x.date||'').slice(0,7)===m})}
function incomeTotal(a){a=a||db.incomes;return a.reduce(function(s,x){return s+Number(x.amount||0)+Number(x.drinkAmount||0)},0)}
function expenseTotal(a){a=a||db.expenses;return a.reduce(function(s,x){return s+Number(x.amount||0)},0)}
function lastCut(id){var a=db.incomes.filter(function(x){return String(x.clientId)===String(id)}).sort(function(a,b){return b.date.localeCompare(a.date)});return a.length?a[0].date:null}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},1500)}
function showApp(){document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.body.setAttribute('data-section',current);buildNav();render()}
document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('password').value.trim().toUpperCase();if(p===PASSWORD){document.getElementById('loginError').classList.add('hidden');showApp()}else{document.getElementById('loginError').classList.remove('hidden')}});
function logout(){closeModal();document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');document.getElementById('password').value='';document.getElementById('loginError').classList.add('hidden');document.body.removeAttribute('data-section');setTimeout(function(){document.getElementById('password').focus()},50)}
document.getElementById('logoutBtn').addEventListener('click',logout);
var items=[['turnos','TURNOS'],['clientes','CLIENTES'],['ingresos','INGRESOS'],['egresos','EGRESOS'],['caja','DISP.'],['reportes','REPORTES']];
function buildNav(){document.getElementById('nav').innerHTML=items.map(function(x){return '<button type="button" class="navbtn '+(current===x[0]?'active':'')+'" data-go="'+x[0]+'">'+x[1]+'</button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(b){b.onclick=function(){current=this.getAttribute('data-go');document.body.setAttribute('data-section',current);buildNav();render()}})}
function title(t){return '<div class="head"><div><div class="title">'+t+'</div><div class="date">SV BARBERIA · '+dmy(today)+'</div></div></div>'}
function render(){var html='';if(current==='turnos')html=renderTurnos();if(current==='clientes')html=renderClientes();if(current==='ingresos')html=renderIngresos();if(current==='egresos')html=renderEgresos();if(current==='caja')html=renderCaja();if(current==='reportes')html=renderReportes();document.getElementById('page').innerHTML=html;document.getElementById('fab').onclick=primaryAction}
function kpi(label,value,sub){return '<div class="card"><div class="klabel">'+label+'</div><div class="kvalue">'+value+'</div>'+(sub?'<div class="ksub">'+sub+'</div>':'')+'</div>'}
function primaryAction(){if(current==='turnos')openTurno();else if(current==='clientes')openCliente();else if(current==='ingresos')openIngreso();else if(current==='egresos')openEgreso();else if(current==='caja')openSaldo();else openIngreso()}
function renderTurnos(){var a=db.appointments.slice().sort(function(x,y){return (x.date+x.time).localeCompare(y.date+y.time)});var hoy=a.filter(function(x){return x.date===today});return title('Turnos')+'<div class="grid kpis">'+kpi('Hoy',hoy.length,'turnos')+kpi('Confirmados',hoy.filter(function(x){return x.status==='Confirmado'}).length,'de hoy')+kpi('Ingresos mes',fmt(incomeTotal(monthRows(db.incomes))))+kpi('Caja total',fmt(db.cash+db.bank))+'</div><div class="section"><div class="section-title">Agenda</div><div class="list">'+(a.length?a.map(function(x){return '<div class="row" onclick="SV.openTurno('+x.id+')"><div class="row-main"><div class="row-title">'+esc(cname(x.clientId))+'</div><div class="row-sub">'+dmy(x.date)+' · '+x.time+' · '+esc(x.service)+'</div></div><div class="row-right"><span class="pill '+(x.status==='Confirmado'?'black':'')+'">'+esc(x.status)+'</span></div></div>'}).join(''):'<div class="empty">Sin turnos.</div>')+'</div></div>'}
function renderClientes(){return title('Clientes')+'<input id="q" class="search" placeholder="Buscar cliente o teléfono"><div id="clientList" class="list">'+clientRows(db.clients)+'</div>'}
function clientRows(a){return a.map(function(c){var ins=db.incomes.filter(function(x){return String(x.clientId)===String(c.id)});return '<div class="row" onclick="SV.clientFile('+c.id+')"><div class="row-main"><div class="row-title">'+esc(c.name)+'</div><div class="row-sub">'+esc(c.phone||'-')+' · Último corte: '+(lastCut(c.id)?dmy(lastCut(c.id)):'sin cortes')+'</div></div><div class="row-right"><div class="amt">'+ins.length+' visitas</div><div class="row-sub">'+fmt(incomeTotal(ins))+'</div></div></div>'}).join('')||'<div class="empty">Sin clientes.</div>'}
function afterRenderClientes(){var q=document.getElementById('q');if(q)q.oninput=function(){var v=this.value.toLowerCase();document.getElementById('clientList').innerHTML=clientRows(db.clients.filter(function(c){return (c.name+' '+c.phone).toLowerCase().indexOf(v)>-1}))}}
var oldRender=render;render=function(){oldRender();if(current==='clientes')afterRenderClientes()};
function renderIngresos(){var a=db.incomes.slice().sort(function(x,y){return y.date.localeCompare(x.date)});return title('Ingresos')+'<div class="grid kpis">'+kpi('Mes',fmt(incomeTotal(monthRows(db.incomes))))+kpi('Cortes',monthRows(db.incomes).length)+kpi('Ticket',fmt(monthRows(db.incomes).length?incomeTotal(monthRows(db.incomes))/monthRows(db.incomes).length:0))+kpi('Bebidas',fmt(monthRows(db.incomes).reduce(function(s,x){return s+Number(x.drinkAmount||0)},0)))+'</div><div class="list">'+a.map(function(x){return '<div class="row"><div class="row-main"><div class="row-title">'+esc(cname(x.clientId))+'</div><div class="row-sub">'+dmy(x.date)+' · '+esc(x.service)+' · '+esc(x.payment)+(x.drink&&x.drink!=='No'?' · '+esc(x.drink):'')+'</div></div><div class="amt">+ '+fmt(Number(x.amount)+Number(x.drinkAmount||0))+'</div></div>'}).join('')+'</div>'}
function renderEgresos(){var a=db.expenses.slice().sort(function(x,y){return y.date.localeCompare(x.date)});return title('Egresos')+'<div class="grid kpis">'+kpi('Mes',fmt(expenseTotal(monthRows(db.expenses))))+kpi('Movimientos',monthRows(db.expenses).length)+kpi('Mayor gasto',fmt(Math.max.apply(null,[0].concat(monthRows(db.expenses).map(function(x){return Number(x.amount)})))))+kpi('Resultado',fmt(incomeTotal(monthRows(db.incomes))-expenseTotal(monthRows(db.expenses))))+'</div><div class="list">'+a.map(function(x){return '<div class="row"><div class="row-main"><div class="row-title">'+esc(x.detail)+'</div><div class="row-sub">'+dmy(x.date)+' · '+esc(x.category)+' · '+esc(x.payment)+'</div></div><div class="amt">− '+fmt(x.amount)+'</div></div>'}).join('')+'</div>'}
function renderCaja(){return title('Disponibilidades')+'<div class="card"><div class="balance"><div><div class="klabel">EFECTIVO</div></div><strong>'+fmt(db.cash)+'</strong></div><div class="balance"><div><div class="klabel">BANCO</div></div><strong>'+fmt(db.bank)+'</strong></div><div class="balance"><div><div class="klabel">TOTAL DISPONIBLE</div></div><strong>'+fmt(db.cash+db.bank)+'</strong></div></div><div class="section"><div class="card"><div class="section-title">Este mes</div><div class="balance"><span>Ingresos</span><b>'+fmt(incomeTotal(monthRows(db.incomes)))+'</b></div><div class="balance"><span>Egresos</span><b>'+fmt(expenseTotal(monthRows(db.expenses)))+'</b></div><div class="balance"><span>Resultado</span><b>'+fmt(incomeTotal(monthRows(db.incomes))-expenseTotal(monthRows(db.expenses)))+'</b></div></div></div>'}
function renderReportes(){var ins=monthRows(db.incomes),outs=monthRows(db.expenses),total=incomeTotal(ins),out=expenseTotal(outs),srv={},pay={};ins.forEach(function(x){srv[x.service]=(srv[x.service]||0)+1;pay[x.payment]=(pay[x.payment]||0)+Number(x.amount)+Number(x.drinkAmount||0)});var mx=Math.max.apply(null,[1].concat(Object.keys(srv).map(function(k){return srv[k]})));return title('Reportes')+'<div class="grid kpis">'+kpi('Resultado mes',fmt(total-out))+kpi('Ticket promedio',fmt(ins.length?total/ins.length:0))+kpi('Clientes activos',new Set(ins.map(function(x){return x.clientId})).size)+kpi('Margen caja',total?Math.round((total-out)/total*100)+'%':'0%')+'</div><div class="card section"><div class="section-title">Servicios</div>'+(Object.keys(srv).length?Object.keys(srv).sort(function(a,b){return srv[b]-srv[a]}).map(function(k){return '<div class="bar-meta"><span>'+esc(k)+'</span><span>'+srv[k]+'</span></div><div class="bar"><span style="width:'+Math.round(srv[k]/mx*100)+'%"></span></div>'}).join(''):'<div class="empty">Sin datos.</div>')+'</div><div class="card section"><div class="section-title">Medios de pago</div>'+Object.keys(pay).map(function(k){return '<div class="balance"><span>'+esc(k)+'</span><b>'+fmt(pay[k])+'</b></div>'}).join('')+'</div>'}
function modal(body){document.getElementById('modalRoot').innerHTML='<div class="modal-bg" id="mb"><div class="modal">'+body+'</div></div>';document.getElementById('mb').onclick=function(e){if(e.target===this)closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function closeBtn(){return '<button type="button" class="x" onclick="SV.closeModal()">×</button>'}
function openTurno(id){var x=id?db.appointments.filter(function(a){return a.id===id})[0]:null;modal('<div class="modal-head"><div class="modal-title">'+(x?'Editar turno':'Nuevo turno')+'</div>'+closeBtn()+'</div><form id="turnoForm"><div class="form2"><div class="field full"><label>CLIENTE</label><select id="tClient">'+db.clients.map(function(c){return '<option value="'+c.id+'" '+(x&&x.clientId===c.id?'selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="field"><label>FECHA</label><input id="tDate" type="date" value="'+(x?x.date:today)+'" required></div><div class="field"><label>HORA</label><input id="tTime" type="time" value="'+(x?x.time:'10:00')+'" required></div><div class="field"><label>SERVICIO</label><select id="tService"><option>Corte</option><option>Corte + barba</option><option>Barba</option></select></div><div class="field"><label>ESTADO</label><select id="tStatus"><option>Confirmado</option><option>Pendiente</option><option>Atendido</option><option>Cancelado</option></select></div></div><div class="actions"><button type="button" class="btn white" onclick="SV.closeModal()">CANCELAR</button><button class="btn black" type="submit">GUARDAR</button></div></form>');document.getElementById('tService').value=x?x.service:'Corte';document.getElementById('tStatus').value=x?x.status:'Confirmado';document.getElementById('turnoForm').onsubmit=function(e){e.preventDefault();var o={id:x?x.id:Date.now(),date:tDate.value,time:tTime.value,clientId:Number(tClient.value),service:tService.value,barber:'SV',status:tStatus.value};if(x){for(var i=0;i<db.appointments.length;i++)if(db.appointments[i].id===x.id)db.appointments[i]=o}else db.appointments.push(o);save();closeModal();render();toast('Turno guardado')}}
function openCliente(){modal('<div class="modal-head"><div class="modal-title">Nuevo cliente</div>'+closeBtn()+'</div><form id="clienteForm"><div class="field"><label>NOMBRE Y APELLIDO</label><input id="cName" required></div><div class="form2"><div class="field"><label>TELÉFONO</label><input id="cPhone"></div><div class="field"><label>EMAIL</label><input id="cEmail" type="email"></div><div class="field full"><label>NOTAS</label><textarea id="cNotes" rows="3"></textarea></div></div><div class="actions"><button type="button" class="btn white" onclick="SV.closeModal()">CANCELAR</button><button class="btn black" type="submit">GUARDAR</button></div></form>');document.getElementById('clienteForm').onsubmit=function(e){e.preventDefault();db.clients.push({id:Date.now(),name:cName.value.trim(),phone:cPhone.value.trim(),email:cEmail.value.trim(),notes:cNotes.value.trim()});save();closeModal();render();toast('Cliente creado')}}
function clientFile(id){var c=cid(id),ins=db.incomes.filter(function(x){return String(x.clientId)===String(id)}).sort(function(a,b){return b.date.localeCompare(a.date)});modal('<div class="modal-head"><div class="overline">LEGAJO</div>'+closeBtn()+'</div><div class="client-hero"><div class="client-name">'+esc(c.name)+'</div><div class="client-meta">'+esc(c.phone||'-')+' · '+esc(c.email||'-')+'</div><div class="mini-actions"><button class="btn black" onclick="SV.closeModal();SV.openIngreso('+id+')">+ INGRESO</button><button class="btn white" onclick="SV.closeModal();SV.openTurno()">+ TURNO</button></div></div><div class="grid kpis section">'+kpi('Último corte',lastCut(id)?dmy(lastCut(id)):'-')+kpi('Visitas',ins.length)+kpi('Facturación',fmt(incomeTotal(ins)))+kpi('Notas',esc(c.notes||'-'))+'</div><div class="section-title section">Historial</div><div class="list">'+(ins.length?ins.map(function(x){return '<div class="row"><div><div class="row-title">'+esc(x.service)+'</div><div class="row-sub">'+dmy(x.date)+'</div></div><b>'+fmt(Number(x.amount)+Number(x.drinkAmount||0))+'</b></div>'}).join(''):'<div class="empty">Sin ingresos.</div>')+'</div>')}
function openIngreso(pre){modal('<div class="modal-head"><div class="modal-title">Cargar ingreso</div>'+closeBtn()+'</div><form id="ingresoForm"><div class="field"><label>CLIENTE</label><select id="iClient">'+db.clients.map(function(c){return '<option value="'+c.id+'" '+(pre===c.id?'selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="form2"><div class="field"><label>FECHA</label><input id="iDate" type="date" value="'+today+'"></div><div class="field"><label>SERVICIO</label><select id="iService"><option>Corte</option><option>Corte + barba</option><option>Barba</option><option>Otro</option></select></div><div class="field"><label>CUÁNTO PAGÓ</label><input id="iAmount" type="number" min="0" value="15000" required></div><div class="field"><label>MEDIO</label><select id="iPayment"><option>Efectivo</option><option>Transferencia</option><option>Débito</option><option>Crédito</option></select></div><div class="field"><label>BEBIÓ</label><select id="iDrink"><option>No</option><option>Agua</option><option>Gaseosa</option><option>Cerveza</option><option>Café</option></select></div><div class="field"><label>IMPORTE BEBIDA</label><input id="iDrinkAmount" type="number" min="0" value="0"></div></div><div class="actions"><button type="button" class="btn white" onclick="SV.closeModal()">CANCELAR</button><button class="btn black" type="submit">GUARDAR</button></div></form>');document.getElementById('ingresoForm').onsubmit=function(e){e.preventDefault();var amount=Number(iAmount.value||0),drink=Number(iDrinkAmount.value||0),pay=iPayment.value,total=amount+drink;db.incomes.push({id:Date.now(),date:iDate.value,clientId:Number(iClient.value),service:iService.value,amount:amount,payment:pay,drink:iDrink.value,drinkAmount:drink});if(pay==='Efectivo')db.cash+=total;else db.bank+=total;save();closeModal();render();toast('Ingreso cargado')}}
function openEgreso(){modal('<div class="modal-head"><div class="modal-title">Cargar egreso</div>'+closeBtn()+'</div><form id="egresoForm"><div class="form2"><div class="field"><label>FECHA</label><input id="eDate" type="date" value="'+today+'"></div><div class="field"><label>CATEGORÍA</label><select id="eCat"><option>Insumos</option><option>Servicios</option><option>Limpieza</option><option>Personal</option><option>Alquiler</option><option>Mantenimiento</option><option>Otros</option></select></div><div class="field full"><label>DETALLE</label><input id="eDetail" required></div><div class="field"><label>IMPORTE</label><input id="eAmount" type="number" min="0" required></div><div class="field"><label>MEDIO</label><select id="ePayment"><option>Efectivo</option><option>Banco</option></select></div></div><div class="actions"><button type="button" class="btn white" onclick="SV.closeModal()">CANCELAR</button><button class="btn black" type="submit">GUARDAR</button></div></form>');document.getElementById('egresoForm').onsubmit=function(e){e.preventDefault();var amount=Number(eAmount.value||0);db.expenses.push({id:Date.now(),date:eDate.value,category:eCat.value,detail:eDetail.value.trim(),amount:amount,payment:ePayment.value});if(ePayment.value==='Efectivo')db.cash-=amount;else db.bank-=amount;save();closeModal();render();toast('Egreso cargado')}}
function openSaldo(){modal('<div class="modal-head"><div class="modal-title">Actualizar saldos</div>'+closeBtn()+'</div><form id="saldoForm"><div class="field"><label>EFECTIVO</label><input id="sCash" type="number" value="'+db.cash+'"></div><div class="field"><label>BANCO</label><input id="sBank" type="number" value="'+db.bank+'"></div><div class="actions"><button type="button" class="btn white" onclick="SV.closeModal()">CANCELAR</button><button class="btn black" type="submit">ACTUALIZAR</button></div></form>');document.getElementById('saldoForm').onsubmit=function(e){e.preventDefault();db.cash=Number(sCash.value||0);db.bank=Number(sBank.value||0);save();closeModal();render();toast('Saldos actualizados')}}
window.SV={openTurno:openTurno,openIngreso:openIngreso,clientFile:clientFile,closeModal:closeModal,logout:logout};
})();
</script>
</body>
</html>
